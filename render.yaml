services:
  - type: web
    name: dounia-os
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_SITE_URL
        value: https://douniaos.com
      # Se pide al crear el servicio; nunca se guarda en el repositorio.
      - key: DEEPSEEK_API_KEY
        sync: false
